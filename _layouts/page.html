---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <time
      class="dt-published"
      datetime="{{ page.date | date_to_xmlschema }}"
      itemprop="datePublished"
    >
      {%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%} {%- if page.date
      -%} Updated {{ page.date | date: date_format }} {%- endif -%}
    </time>
  </header>

  <div class="post-content">{{ content }}</div>
</article>
